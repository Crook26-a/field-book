<style>
  /* the same aged plat sheet as Ordinate Survey: rag paper, iron-gall ink, red lead for the marks */
  :root {
    --paper: #e5d7b4; --paper-lit: #eee3c7; --paper-deep: #d6c49c; --card: #f3eacf;
    --ink: #3a2e1e; --ink-soft: #6d5c43; --ink-faint: #9b8968; --rule: #bfab84; --rule-soft: #cdbb98;
    --lead: #a8331f; --lead-soft: #f0d9c8; --good: #5e7a4e;
  }
  body.dark {
    --paper: #1d1912; --paper-lit: #272118; --paper-deep: #15120d; --card: #2a2419;
    --ink: #eadfc4; --ink-soft: #bba985; --ink-faint: #8a7a5c; --rule: #4a3f2d; --rule-soft: #3a3124;
    --lead: #e0785f; --lead-soft: #3d2620; --good: #93b07f;

  button, .tab { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  input, textarea, select { -webkit-user-select: text; user-select: text; }
  html, body { overscroll-behavior-y: none; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif; font-size: 16px; line-height: 1.35;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, rgba(191,171,132,.28) 27px, rgba(191,171,132,.28) 28px);
  }
  body.dark { background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, rgba(74,63,45,.45) 27px, rgba(74,63,45,.45) 28px); }
  .wrap { max-width: 620px; margin: 0 auto; padding: 16px 14px calc(96px + env(safe-area-inset-bottom)); }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  .caps { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: var(--ink-soft); }

  header { border-bottom: 3px double var(--ink); padding-bottom: 10px; margin-bottom: 14px; }
  .headrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  header h1 { margin: 0; font-size: 30px; line-height: 1; font-weight: normal; letter-spacing: .02em; }
  header h1 b { color: var(--lead); font-weight: normal; }
  header p { margin: 4px 0 0; }
  #themeBtn { background: none; border: 1px solid var(--rule); color: var(--ink); border-radius: 3px; padding: 6px 10px; font: inherit; font-size: 14px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--paper-lit); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 3px; padding: 10px 12px; font: inherit; font-size: 15px; cursor: pointer; min-height: 44px; }
  .btn:active { background: var(--paper-deep); }
  .btn.wide { width: 100%; margin: 0 0 10px; }
  .btn.main { background: var(--ink); color: var(--paper-lit); border-color: var(--ink); }
  .btn.danger { color: var(--lead); border-color: var(--lead); }
  .btn.small { min-height: 36px; padding: 6px 10px; font-size: 14px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row > * { min-width: 0; }

  input[type=text], input[type=number], input:not([type]), select, textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 9px 10px; }
  textarea { resize: vertical; min-height: 64px; }
  select { padding: 8px 6px; }
  .fld { display: block; margin: 0 0 10px; flex: 1; }
  .fld > span { display: block; margin: 0 0 3px; }
  .fld > span, .lab { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; text-transform: uppercase; letter-spacing: .1em; font-size: 10.5px; color: var(--ink-soft); }
  .with { display: flex; gap: 6px; }
  .with > input, .with > select, .with > textarea { flex: 1; }
  .dice { flex: none; width: 44px; min-height: 40px; padding: 0; font-size: 19px; }
  .check { display: flex; align-items: center; gap: 8px; margin: 2px 0 12px; font-size: 15px; }
  .check input { width: 22px; height: 22px; }
  .note { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 10px; }
  .search { margin: 0 0 10px; }

  /* the list: the name always shows in full; what it is goes underneath */
  .card { display: block; width: 100%; text-align: left; background: var(--card); color: var(--ink); border: 1px solid var(--rule); border-radius: 3px;
    padding: 10px 12px; margin: 0 0 8px; font: inherit; cursor: pointer; position: relative; }
  .card .nm { font-size: 17px; overflow-wrap: anywhere; padding-right: 18px; }
  .card .sub { display: block; margin-top: 3px; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11.5px; color: var(--ink-soft); }
  .card .dot { position: absolute; top: 13px; right: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--lead); }
  .empty { text-align: center; color: var(--ink-soft); padding: 26px 10px; font-style: italic; }

  /* an open entry: its name stays in sight at the top while you scroll the form */
  .sheet-top { position: sticky; top: 0; z-index: 5; background: var(--paper); margin: -16px -14px 12px; padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 10px; }
  .sheet-top .ttl { flex: 1; min-width: 0; }
  .sheet-top .ttl b { display: block; font-weight: normal; font-size: 19px; overflow-wrap: anywhere; line-height: 1.15; }
  .sheet-top .ttl small { color: var(--lead); }
  .draft-mark { border: 1px dashed var(--lead); border-radius: 3px; padding: 10px 12px 2px; margin-bottom: 12px; }
  details.sec { border-top: 1px solid var(--rule); padding: 8px 0 2px; margin: 4px 0 6px; }
  details.sec > summary { cursor: pointer; list-style: none; padding: 6px 0; font-size: 16.5px; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::before { content: "▸ "; color: var(--ink-faint); }
  details.sec[open] > summary::before { content: "▾ "; }
  details.sec > summary small { color: var(--ink-soft); font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; margin-left: 4px; }
  .abil { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin: 0 0 10px; }
  .abil label { text-align: center; }
  .abil input { text-align: center; padding: 8px 2px; }
  .purse { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 0 0 10px; }
  .purse label { text-align: center; }
  .atk { border: 1px solid var(--rule-soft); border-radius: 3px; padding: 8px 8px 0; margin: 0 0 8px; background: var(--paper-lit); }
  .foot { position: sticky; bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 4; background: var(--paper); padding: 10px 0 2px; border-top: 1px solid var(--rule); margin-top: 8px; }

  /* bottom tabs */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; background: var(--paper-lit); border-top: 3px double var(--ink);
    padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs button { flex: 1; background: none; border: 0; color: var(--ink-soft); font: inherit; font-size: 15px; padding: 10px 4px 12px; min-height: 58px; position: relative; }
  nav.tabs button.on { color: var(--ink); }
  nav.tabs button.on::after { content: ""; position: absolute; left: 22%; right: 22%; top: 0; height: 3px; background: var(--lead); }
  nav.tabs small { display: block; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--lead); color: #fff; font-size: 11px; line-height: 18px; }

  .panel { background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 12px 12px 4px; margin: 0 0 14px; }
  .panel h2 { margin: 0 0 6px; font-size: 19px; font-weight: normal; }
  #toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; max-width: 92vw;
    background: var(--ink); color: var(--paper-lit); padding: 10px 14px; border-radius: 3px; font-size: 14.5px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.on { opacity: 1; }
  textarea.out { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; min-height: 140px; }
</style>
</head>

  "owes their life to whoever leads this lot","took the job to get close to someone they mean to hurt","drifted into it one bad decision at a time"];
const GEN_HOPE = ["wants to buy a boat of their own","means to quit after one more job","sends most of their pay home to a sick parent",
  "dreams of a quiet farm and a dog","wants their name cleared","is saving to find a sister who was sold off years ago",
  "would trade everything for a second chance","wants to be feared, just once","hopes nobody from home ever learns what they do",
  "is planning to betray the others and take the lot","keeps a letter they've never had the nerve to send","wants to see the open sea before they die"];
const ALIGNMENTS = ["Lawful Good","Neutral Good","Chaotic Good","Lawful Neutral","Neutral","Chaotic Neutral","Lawful Evil","Neutral Evil","Chaotic Evil"];

const pickOne = a => a[Math.floor(Math.random()*a.length)];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const $ = s => document.querySelector(s);
const uid = p => `${p}_fb${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
const rollName = () => `${pickOne(GEN_FIRST)}${Math.random()<.25 ? ` "${pickOne(GEN_NICK)}"` : ""} ${pickOne(GEN_FAMILY)}`;
const rollBackstory = () => `${cap(pickOne(GEN_ORIGIN))}, and ${pickOne(GEN_TURN)}. ${cap(pickOne(GEN_HOPE))}.`;
/* an alignment that suits the attitude (the survey's own weighting): enemies lean evil, allies good, every one possible */
function rollAlignment(disp){
  const good = ALIGNMENTS.slice(0,3), mid = ALIGNMENTS.slice(3,6), evil = ALIGNMENTS.slice(6);
  return pickOne(disp==="enemy" ? [...evil,...evil,...evil,...mid] : disp==="ally" ? [...good,...good,...good,...mid] : disp==="neutral" ? [...mid,...mid,...mid,...good,...evil] : ALIGNMENTS);
}
const rarityGuess = (rarity, potion) => { const g = RARITY_GP[String(rarity||"").toLowerCase()]; return g==null ? "" : "~" + (g*(potion?0.5:1)).toLocaleString() + " gp"; };

/* ── storage: one record on this phone. Send often: a phone can clear a web app's storage. ── */
function norm(o){ o = o && typeof o==="object" ? o : {};
  return { loot:Array.isArray(o.loot) ? o.loot : [], npcs:Array.isArray(o.npcs) ? o.npcs : [], lastSent:o.lastSent||0, theme:o.theme||"" }; }
let db = (() => { try { const t = localStorage.getItem(STORE); if (t) return norm(JSON.parse(t)); } catch (e) {} return norm(null); })();
let saveTimer = null;
function save(now){
  clearTimeout(saveTimer);
  const go = () => { try { localStorage.setItem(STORE, JSON.stringify(db)); } catch (e) { toast("This phone wouldn't save it. Send what you have now (Send tab)."); } };
  if (now) go(); else saveTimer = setTimeout(go, 250);
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
window.addEventListener("pagehide", () => save(true));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(true); });

let toastTimer = null;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 3200); }

/* ── light or dark: follows the phone until you pick ── */

const SELui = (k, label, opts) => `<label class="fld" style="flex:1;margin:0"><span>${label}</span><select data-ui="${k}">${opts.map(([v,l])=>`<option value="${v}" ${v===ui[k]?"selected":""}>${l}</option>`).join("")}</select></label>`;

/* ── sending: a .json file the survey's Library brings in (Library → Field Book → Bring in), or text to paste ── */
function pack(list){ const clean = x => { const o = {}; for (const k in x) if (!/^fb/.test(k)) o[k] = x[k]; if (o.fightsAs==="block") delete o.fightsAs; return o; };
  return { format:"ordinate-fieldbook", version:VERSION, app:"Field Book", exported:new Date().toISOString(),
    loot:list.filter(x=>db.loot.includes(x)).map(clean), npcs:list.filter(x=>db.npcs.includes(x)).map(clean) }; }
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}${p(d.getMinutes())}`; };
let lastText = "";
function sendView(){
  const fresh = [...db.loot, ...db.npcs].filter(changed), all = db.loot.length + db.npcs.length;
  const when = db.lastSent ? new Date(db.lastSent).toLocaleString([], { dateStyle:"medium", timeStyle:"short" }) : "never";
  return `<div class="panel"><h2>Send to the survey</h2>
      <p class="note">${fresh.length ? `<b>${fresh.length}</b> new or changed since you last sent (${esc(when)}).` : all ? `Everything has been sent (last: ${esc(when)}).` : "Nothing written yet."}</p>
      <button class="btn wide main" data-act="send" data-what="new" ${fresh.length?"":"disabled"}>Send what's new${fresh.length?` (${fresh.length})`:""}</button>
      <button class="btn wide" data-act="send" data-what="all" ${all?"":"disabled"}>Send everything (${all})</button>
      <button class="btn wide" data-act="copy" ${all?"":"disabled"}>Copy what's new as text</button>
      <p class="note">Sending makes a file (field-book-…json). <b>Save it to Google Drive, in My Drive → DnD → Field Book inbox</b> (Android: Drive in the share sheet; iPhone: Save to Files → Drive), and Ordinate Survey brings it into its Library by itself. Or share it anywhere and use the Library's <b>Field Book: bring in…</b>, or hand it to Claude. The same entry sent twice updates the one already there.</p>
      ${lastText ? `<label class="fld"><span>The text (copy it if it didn't copy itself)</span><textarea class="out" readonly>${esc(lastText)}</textarea></label>` : ""}</div>
    <div class="panel"><h2>Bring a file in</h2>
      <p class="note">A Field Book file from another phone, a backup, or the survey's own Library (Library → Field Book → Send to it) so you can work on things you already have.</p>
      <button class="btn wide" data-act="import">Choose a file…</button></div>
    <div class="panel"><h2>On this phone</h2>
      <p class="note">${db.loot.length} item${db.loot.length===1?"":"s"} and ${db.npcs.length} ${db.npcs.length===1?"person":"people"}, kept on this phone only. Send now and then: a phone can clear a web app's storage, and sending is the backup.</p>
      <p class="note">Add it to your home screen (Share → Add to Home Screen on an iPhone; ⋮ → Install app on Android) and it works offline.</p>
      <button class="btn wide danger" data-act="wipe" ${all?"":"disabled"}>Delete everything on this phone</button>
      <p class="note mono" style="font-size:11px">Field Book v${VERSION}</p></div>`;
}
async function send(what){
  const list = what==="all" ? [...db.loot, ...db.npcs] : [...db.loot, ...db.npcs].filter(changed);
  if (!list.length) return;
  const text = JSON.stringify(pack(list), null, 1), name = `field-book-${stamp().replace(" ","-")}.json`;
  const file = new File([text], name, { type:"application/json" });
  const done = () => { const t = Date.now(); for (const x of list) x.fbSent = x.fbEdited || t; db.lastSent = t; save(true); render(); };
  if (navigator.canShare && navigator.canShare({ files:[file] })) {
    try { await navigator.share({ files:[file], title:"Field Book", text:`${list.length} from the Field Book, for Ordinate Survey` }); done(); toast(`Sent ${list.length}.`); return; }
    catch (e) { if (e && e.name==="AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  done(); toast(`Saved ${name}.`);
}
async function copyText(){
  const fresh = [...db.loot, ...db.npcs].filter(changed), list = fresh.length ? fresh : [...db.loot, ...db.npcs];
  lastText = JSON.stringify(pack(list));
  try { await navigator.clipboard.writeText(lastText); toast(`Copied ${list.length}${fresh.length ? "" : " (everything: nothing was new)"}. Paste it to Claude or into an email.`); }
  catch (e) { toast("Couldn't copy by itself: copy the text below."); }
  render();
}
function bringIn(text){
  let o; try { o = JSON.parse(text); } catch (e) { toast("That isn't a Field Book file."); return; }
  if (!o || (!Array.isArray(o.loot) && !Array.isArray(o.npcs))) { toast("No items or people in that file."); return; }
  let added = 0, updated = 0;
  for (const cat of ["loot","npcs"]) for (const x of (o[cat]||[])) {
    if (!x || typeof x!=="object" || !x.name) continue;
    if (!x.id) x.id = uid(cat==="loot" ? "ll" : "ln");
    const had = db[cat].find(y=>y.id===x.id), t = Date.now();
    if (had) { Object.assign(had, x); had.fbSent = had.fbEdited = t; updated++; } else { x.fbMade = x.fbSent = x.fbEdited = t; db[cat].push(x); added++; }
  }
  save(true); render(); toast(added || updated ? `Brought in: ${added} new, ${updated} updated.` : "Nothing new in that file.");
}

/* ── doing things ── */
function touch(x){ x.fbEdited = Date.now(); if (!ui.draft) save(); }
function setField(x, k, v){
  if (k.startsWith("atk.")) { const [, j, f] = k.split("."); (x.attacks = x.attacks||[])[+j] = Object.assign(x.attacks[+j]||{}, { [f]:v }); }
  else if (k.startsWith("purse.")) { x.purse = x.purse||{}; const n = Math.max(0, Math.round(+v||0)); if (n) x.purse[k.slice(6)] = n; else delete x.purse[k.slice(6)]; }
  else if (v==="" || v===false) delete x[k];
  else x[k] = v;
}
const view = $("#view");
view.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.q != null) { ui.q = t.value; const at = t.selectionStart; render(); const s = $(".search"); if (s) { s.focus(); try { s.setSelectionRange(at, at); } catch (err) {} } return; }
  const x = entry(); if (!x) return;
  if (t.dataset.fname != null) { x.fightsAs = t.value.trim() || "block"; touch(x); return; }
  const k = t.dataset.f; if (!k || t.type==="checkbox" || t.tagName==="SELECT") return;
  setField(x, k, t.value); touch(x);
  if (k==="name") { const b = $("#ttl"); if (b) b.textContent = t.value || CAT_WORD[ui.tab][2]; const a = $("#addBtn"); if (a) a.textContent = `Add${t.value.trim() ? " " + t.value.trim() : ""} to the Field Book`; }
});
view.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.ui) { ui[t.dataset.ui] = t.value; return; }
  const x = entry(); if (!x) return;
  if (t.dataset.fmode != null) { x.fightsAs = t.value==="block" ? (fightsWord(x.fightsAs)!=="self" && x.fightsAs ? x.fightsAs : "block") : t.value; if (!x.fightsAs) delete x.fightsAs; touch(x); render(); return; }
  const k = t.dataset.f; if (!k) return;
  if (t.type==="checkbox") setField(x, k, t.checked);
  else if (t.tagName==="SELECT") {
    setField(x, k, t.value);
    /* the price follows the rarity (half for a potion) unless you typed one */
    if ((k==="rarity" || k==="kind") && ui.tab==="loot") { const g = rarityGuess(x.rarity, x.kind==="potion"); if (g && (!x.value || /^~/.test(String(x.value).trim()))) x.value = g; }
  } else return;
  touch(x); render();
});
view.addEventListener("toggle", e => { const d = e.target; if (d.dataset && d.dataset.sec) { if (d.open) openSecs.add(d.dataset.sec); else openSecs.delete(d.dataset.sec); } }, true);
view.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-open],[data-roll]"); if (!b) return;
  if (b.dataset.open) { ui.open = b.dataset.open; ui.draft = null; render(); scrollTo(0, 0); return; }
  const x = entry();
  if (b.dataset.roll && x) {
    const r = b.dataset.roll, d = ui.disp || pickOne(["enemy","neutral","ally"]);
    if (r==="name") x.name = rollName();
    else if (r==="align") x.align = rollAlignment(ui.disp);
    else if (r==="look") x.look = cap(pickOne(GEN_LOOK));
    else if (r==="voice") x.voice = cap(pickOne(GEN_VOICE));
    else if (r==="wants") x.wants = cap(pickOne(GEN_WANTS[d]));
    else if (r==="knows") x.knows = cap(pickOne(GEN_SECRET));
    else if (r==="backstory") x.backstory = rollBackstory();
    else if (r==="whole") { const sp = pickOne(GEN_SPECIES);
      Object.assign(x, { name:rollName(), species:sp, role:`${{ enemy:"Enemy", neutral:"Neutral", ally:"Potential ally" }[d]} · ${sp}`, align:rollAlignment(d),
        look:cap(pickOne(GEN_LOOK)), voice:cap(pickOne(GEN_VOICE)), wants:cap(pickOne(GEN_WANTS[d])), knows:cap(pickOne(GEN_SECRET)), backstory:rollBackstory() }); }
    touch(x); render(); return;
  }
  const a = b.dataset.act;
  if (a==="new") { const cat = ui.tab; ui.draft = { cat, x: cat==="loot" ? { id:uid("ll"), name:"", kind:"curio" } : { id:uid("ln"), name:"" } }; ui.open = null; render(); scrollTo(0, 0);
    const n = view.querySelector('[data-f="name"]'); if (n) n.focus(); return; }
  if (a==="back") { ui.draft = null; ui.open = null; save(true); render(); return; }
  if (a==="add" && ui.draft) {
    const d = ui.draft.x; d.name = String(d.name||"").trim();
    if (!d.name) { toast("Give it a name first."); const n = view.querySelector('[data-f="name"]'); if (n) n.focus(); return; }
    d.fbMade = d.fbEdited = Date.now(); db[ui.draft.cat].unshift(d); ui.draft = null; ui.open = null; save(true); render(); toast(`${d.name} is in the Field Book.`); return;
  }
  if (a==="del" && x) { if (!confirm(`Delete ${x.name||"this"} from the Field Book?${x.fbSent ? " (What you already sent to the survey stays there.)" : ""}`)) return;
    db[ui.tab] = db[ui.tab].filter(y=>y!==x); ui.open = null; save(true); render(); return; }
  if (a==="atkadd" && x) { (x.attacks = x.attacks||[]).push({ name:"", hit:"", dmg:"", dtype:"" }); touch(x); render(); return; }
  if (a==="atkdel" && x) { (x.attacks||[]).splice(+b.dataset.k, 1); touch(x); render(); return; }
  if (a==="carryadd" && x) { const s = view.querySelector("[data-carrypick]"), it = s && db.loot.find(i=>i.id===s.value); if (!it) { toast("Pick an item first."); return; }
    x.carries = (String(x.carries||"").replace(/\s+$/,"") ? String(x.carries).replace(/\s+$/,"") + "\n" : "") + it.name; touch(x); render(); toast(`${x.name||"They"} carries ${it.name}.`); return; }
  if (a==="send") return void send(b.dataset.what);
  if (a==="copy") return void copyText();
  if (a==="import") { $("#fileIn").click(); return; }
  if (a==="wipe") { if (!confirm("Delete every item and person on this phone? Anything not sent is gone for good.") || !confirm("Really delete everything?")) return;
    db.loot = []; db.npcs = []; save(true); render(); toast("Emptied."); return; }
});
$("#fileIn").onchange = e => { const f = e.target.files && e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => bringIn(String(r.result||"")); r.readAsText(f); e.target.value = ""; };
$("#tabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (!b) return;
  if (ui.draft && ui.draft.x.name && !confirm(`Leave ${ui.draft.x.name} without adding it?`)) return;
  ui.tab = b.dataset.tab; ui.open = null; ui.draft = null; ui.q = ""; render(); scrollTo(0, 0); };

applyTheme(); render();

// ── service worker (offline once installed) ──
if ("serviceWorker" in navigator && location.protocol === "https:") {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!hadController || reloaded) return; reloaded = true; location.reload(); });
  navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then(reg => { reg.update(); setInterval(() => { try { reg.update(); } catch (e) {} }, 30 * 60 * 1000); }).catch(() => {});
}
</script>
</body>
</html>
