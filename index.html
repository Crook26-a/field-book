<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Book</title>
<meta name="description" content="A pocket notebook for Ordinate Survey: write up items and people away from the table, then send them to the survey.">
<meta name="theme-color" content="#3a2e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Field Book">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* the same aged plat sheet as Ordinate Survey: rag paper, iron-gall ink, red lead for the marks */
  :root {
    --paper: #e5d7b4; --paper-lit: #eee3c7; --paper-deep: #d6c49c; --card: #f3eacf;
    --ink: #3a2e1e; --ink-soft: #6d5c43; --ink-faint: #9b8968; --rule: #bfab84; --rule-soft: #cdbb98;
    --lead: #a8331f; --lead-soft: #f0d9c8; --good: #5e7a4e;
  }
  body.dark {
    --paper: #1d1912; --paper-lit: #272118; --paper-deep: #15120d; --card: #2a2419;
    --ink: #eadfc4; --ink-soft: #bba985; --ink-faint: #8a7a5c; --rule: #4a3f2d; --rule-soft: #3a3124;
    --lead: #e0785f; --lead-soft: #3d2620; --good: #93b07f;
  }
  * { box-sizing: border-box; }
  button, .tab { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  input, textarea, select { -webkit-user-select: text; user-select: text; }
  html, body { overscroll-behavior-y: none; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif; font-size: 16px; line-height: 1.35;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, rgba(191,171,132,.28) 27px, rgba(191,171,132,.28) 28px);
  }
  body.dark { background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, rgba(74,63,45,.45) 27px, rgba(74,63,45,.45) 28px); }
  .wrap { max-width: 620px; margin: 0 auto; padding: 16px 14px calc(96px + env(safe-area-inset-bottom)); }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  .caps { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: var(--ink-soft); }

  header { border-bottom: 3px double var(--ink); padding-bottom: 10px; margin-bottom: 14px; }
  .headrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  header h1 { margin: 0; font-size: 30px; line-height: 1; font-weight: normal; letter-spacing: .02em; }
  header h1 b { color: var(--lead); font-weight: normal; }
  header p { margin: 4px 0 0; }
  #themeBtn { background: none; border: 1px solid var(--rule); color: var(--ink); border-radius: 3px; padding: 6px 10px; font: inherit; font-size: 14px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--paper-lit); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 3px; padding: 10px 12px; font: inherit; font-size: 15px; cursor: pointer; min-height: 44px; }
  .btn:active { background: var(--paper-deep); }
  .btn.wide { width: 100%; margin: 0 0 10px; }
  .btn.main { background: var(--ink); color: var(--paper-lit); border-color: var(--ink); }
  .btn.danger { color: var(--lead); border-color: var(--lead); }
  .btn.small { min-height: 36px; padding: 6px 10px; font-size: 14px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row > * { min-width: 0; }

  input[type=text], input[type=number], input:not([type]), select, textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 9px 10px; }
  textarea { resize: vertical; min-height: 64px; }
  select { padding: 8px 6px; }
  .fld { display: block; margin: 0 0 10px; flex: 1; }
  .fld > span { display: block; margin: 0 0 3px; }
  .fld > span, .lab { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; text-transform: uppercase; letter-spacing: .1em; font-size: 10.5px; color: var(--ink-soft); }
  .with { display: flex; gap: 6px; }
  .with > input, .with > select, .with > textarea { flex: 1; }
  .dice { flex: none; width: 44px; min-height: 40px; padding: 0; font-size: 19px; }
  .check { display: flex; align-items: center; gap: 8px; margin: 2px 0 12px; font-size: 15px; }
  .check input { width: 22px; height: 22px; }
  .note { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 10px; }
  .search { margin: 0 0 10px; }

  /* the list: the name always shows in full; what it is goes underneath */
  .card { display: block; width: 100%; text-align: left; background: var(--card); color: var(--ink); border: 1px solid var(--rule); border-radius: 3px;
    padding: 10px 12px; margin: 0 0 8px; font: inherit; cursor: pointer; position: relative; }
  .card .nm { font-size: 17px; overflow-wrap: anywhere; padding-right: 18px; }
  .card .sub { display: block; margin-top: 3px; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11.5px; color: var(--ink-soft); }
  .card .dot { position: absolute; top: 13px; right: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--lead); }
  .empty { text-align: center; color: var(--ink-soft); padding: 26px 10px; font-style: italic; }

  /* an open entry: its name stays in sight at the top while you scroll the form */
  .sheet-top { position: sticky; top: 0; z-index: 5; background: var(--paper); margin: -16px -14px 12px; padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 10px; }
  .sheet-top .ttl { flex: 1; min-width: 0; }
  .sheet-top .ttl b { display: block; font-weight: normal; font-size: 19px; overflow-wrap: anywhere; line-height: 1.15; }
  .sheet-top .ttl small { color: var(--lead); }
  .draft-mark { border: 1px dashed var(--lead); border-radius: 3px; padding: 10px 12px 2px; margin-bottom: 12px; }
  details.sec { border-top: 1px solid var(--rule); padding: 8px 0 2px; margin: 4px 0 6px; }
  details.sec > summary { cursor: pointer; list-style: none; padding: 6px 0; font-size: 16.5px; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::before { content: "▸ "; color: var(--ink-faint); }
  details.sec[open] > summary::before { content: "▾ "; }
  details.sec > summary small { color: var(--ink-soft); font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; margin-left: 4px; }
  .abil { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin: 0 0 10px; }
  .abil label { text-align: center; }
  .abil input { text-align: center; padding: 8px 2px; }
  .purse { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 0 0 10px; }
  .purse label { text-align: center; }
  .atk { border: 1px solid var(--rule-soft); border-radius: 3px; padding: 8px 8px 0; margin: 0 0 8px; background: var(--paper-lit); }
  .foot { position: sticky; bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 4; background: var(--paper); padding: 10px 0 2px; border-top: 1px solid var(--rule); margin-top: 8px; }

  /* bottom tabs */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; background: var(--paper-lit); border-top: 3px double var(--ink);
    padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs button { flex: 1 1 0; min-width: 0; background: none; border: 0; color: var(--ink-soft); font: inherit; font-size: 14px; padding: 10px 1px 12px; min-height: 58px; position: relative; }
  nav.tabs button.on { color: var(--ink); }
  nav.tabs button.on::after { content: ""; position: absolute; left: 22%; right: 22%; top: 0; height: 3px; background: var(--lead); }
  nav.tabs small { display: block; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--lead); color: #fff; font-size: 11px; line-height: 18px; }

  .panel { background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 12px 12px 4px; margin: 0 0 14px; }
  .panel h2 { margin: 0 0 6px; font-size: 19px; font-weight: normal; }
  /* the version, in the corner: it changes with every update */
  #ver { position: fixed; top: calc(3px + env(safe-area-inset-top)); right: 7px; z-index: 30; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10.5px; color: var(--ink-faint); pointer-events: none; }
  #toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; max-width: 92vw;
    background: var(--ink); color: var(--paper-lit); padding: 10px 14px; border-radius: 3px; font-size: 14.5px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.on { opacity: 1; }
  textarea.out { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; min-height: 140px; }
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr">
    <div class="headrow"><h1>Field <b>Book</b></h1><button id="themeBtn" aria-label="Light or dark">◐</button></div>
    <p class="caps">A pocket notebook for Ordinate Survey</p>
    <div id="install" hidden style="margin-top:10px;padding:9px 11px;border:1px dashed var(--lead);border-radius:3px;font-size:14.5px"></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="ver" aria-hidden="true"></div>
<input type="file" id="fileIn" accept=".json,.txt,application/json,text/plain" hidden>
<script>/* what survey.js asks the phone for: its library, and the level to roll at */
window.FB_SURVEY = { lib: () => ({ foes:[], npcs:db.npcs, loot:db.loot, spells:db.spells, tables:[] }), level: () => ui.level || 3 };</script>
<script src="survey.js"></script>
<script>
"use strict";
/* ══ Field Book — write up items and people for Ordinate Survey away from the computer, then send them over.
   Everything stays on this phone (localStorage) until you send it: a .json file the survey's Library brings in. ══ */
const VERSION = 13;
const STORE = "fieldbook";

/* ── the same lists the survey uses, so what you make here fits straight in. Rules wording from the 2024 rules
   (SRD 5.2); price guide from its "Magic Item Rarities and Values" table. ── */
const LOOT_KINDS = ["curio","gear","weapon","armor","tool","potion","scroll","poison","magic item","treasure","trade good","mount","vehicle","story"];
const RARITIES = ["Mundane","Common","Uncommon","Rare","Very Rare","Legendary","Artifact"];
const RARITY_GP = { common:100, uncommon:400, rare:4000, "very rare":40000, legendary:200000 };
const ITEM_USES = ["Action","Bonus Action","Magic action","Utilize action","Reaction","No action"];
const REGAIN_WHEN = [["dawn","At dawn"],["long","After a Long Rest"],["rest","After a Short or Long Rest"]];
const CONDITIONS = ["Blinded","Charmed","Deafened","Exhaustion","Frightened","Grappled","Incapacitated","Invisible",
  "Paralyzed","Petrified","Poisoned","Prone","Restrained","Stunned","Unconscious"];
const DAMAGE_TYPES = ["acid","bludgeoning","cold","fire","force","lightning","necrotic","piercing","poison","psychic","radiant","slashing","thunder"];
const COINS = [["cp","Copper"],["sp","Silver"],["ep","Electrum"],["gp","Gold"],["pp","Platinum"]];
const ABILS = [["str","Str"],["dex","Dex"],["con","Con"],["int","Int"],["wis","Wis"],["cha","Cha"]];
const DISPS = [["","Any"],["enemy","Enemy"],["neutral","Neutral"],["ally","Potential ally"]];

/* ── the survey's own roll tables and its roller: survey.js, built from Ordinate Survey's index.html by its Tools/build-fieldbook.ps1, so
   people roll here exactly as they do there (class stat block by level, hit points, a caster's spells and slots, weapons) ── */
const { GEN_FIRST, GEN_FAMILY, GEN_NICK, GEN_SPECIES, GEN_LOOK, GEN_VOICE, GEN_WANTS, GEN_SECRET, ALIGNMENTS } = Survey;

const pickOne = a => a[Math.floor(Math.random()*a.length)];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const $ = s => document.querySelector(s);
const uid = p => `${p}_fb${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
const rollName = () => `${pickOne(GEN_FIRST)}${Math.random()<.25 ? ` "${pickOne(GEN_NICK)}"` : ""} ${pickOne(GEN_FAMILY)}`;
const rollBackstory = () => Survey.genBackstory();
/* an alignment that suits the attitude (the survey's own weighting): enemies lean evil, allies good, every one possible */
const rollAlignment = d => Survey.rollAlignment(d);
const rarityGuess = (rarity, potion) => { const g = RARITY_GP[String(rarity||"").toLowerCase()]; return g==null ? "" : "~" + (g*(potion?0.5:1)).toLocaleString() + " gp"; };

/* ── storage: one record on this phone. Send often: a phone can clear a web app's storage. ── */
function norm(o){ o = o && typeof o==="object" ? o : {};
  return { loot:Array.isArray(o.loot) ? o.loot : [], npcs:Array.isArray(o.npcs) ? o.npcs : [], spells:Array.isArray(o.spells) ? o.spells : [], shops:Array.isArray(o.shops) ? o.shops : [], factions:Array.isArray(o.factions) ? o.factions : [], lastSent:o.lastSent||0, theme:o.theme||"", roll:o.roll||{} }; }
let db = (() => { try { const t = localStorage.getItem(STORE); if (t) return norm(JSON.parse(t)); } catch (e) {} return norm(null); })();
let saveTimer = null;
function save(now){
  clearTimeout(saveTimer);
  const go = () => { try { localStorage.setItem(STORE, JSON.stringify(db)); } catch (e) { toast("This phone wouldn't save it. Send what you have now (Send tab)."); } };
  if (now) go(); else saveTimer = setTimeout(go, 250);
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
window.addEventListener("pagehide", () => save(true));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(true); });

let toastTimer = null;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 3200); }

/* ── light or dark: follows the phone until you pick ── */
function applyTheme(){ const dark = db.theme ? db.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.body.classList.toggle("dark", dark); document.querySelector('meta[name="theme-color"]').content = dark ? "#1d1912" : "#3a2e1e"; }
$("#themeBtn").onclick = () => { db.theme = document.body.classList.contains("dark") ? "light" : "dark"; save(); applyTheme(); };

/* ── what's on screen ── */
const ui = { tab:"loot", open:null, draft:null, q:"", disp:"", level:3, role:"", kind:"", species:"", align:"", type:"Humanoid", foe:"" };     // open: an entry's id; draft: { cat, x } not added yet
const ROLL_KEYS = ["disp","level","role","kind","species","align","type","foe"];
Object.assign(ui, db.roll || {});                     // the roller's settings, as you last left them
const CAT_WORD = { loot:["item","items","New item"], npcs:["person","people","New person"], spells:["spell","spells","New spell"], shops:["shop kind","shop kinds","New shop kind"], factions:["faction","factions","New faction"] };
const allEntries = () => [...db.loot, ...db.npcs, ...db.spells, ...db.shops, ...db.factions];
const entry = () => ui.draft ? ui.draft.x : ui.open ? (db[ui.tab]||[]).find(x=>x.id===ui.open) : null;
const changed = x => (x.fbEdited||0) > (x.fbSent||0);
const toSend = () => allEntries().filter(changed).length;

function itemLine(x){ return [x.kind, x.rarity && x.rarity!=="Mundane" ? x.rarity : "", x.value, x.dmg ? `${x.dmg}${x.dtype?" "+x.dtype:""}` : "", x.heal ? `heals ${x.heal}` : "", x.charges ? `${x.charges} charges` : "", x.attune ? "attunement" : ""].filter(Boolean).join(" · "); }
function personLine(x){ return [x.role, x.align, x.where].filter(Boolean).join(" · "); }
function factionLine(x){ const E = Survey.factionEffects(x); return [x.align ? Survey.ALIGN_ABBR[x.align] || x.align : "", `standing ${Survey.sgn(E.s)} · ${E.tier.label.toLowerCase()}`, x.hidden ? "hidden from the players" : ""].filter(Boolean).join(" · "); }
function shopLine(x){ const k = Survey.PEOPLE_KINDS[x.keeper]; return [k ? `kept by a ${k.label.toLowerCase()}` : "", `${x.nmin||4}-${x.nmax||6} for sale`, `${String(x.srd||"").split("\n").filter(s=>s.trim()).length + String(x.goods||"").split("\n").filter(s=>s.trim()).length} it can stock`].filter(Boolean).join(" · "); }
const lineOf = (cat, x) => cat==="loot" ? itemLine(x) : cat==="spells" ? Survey.spellLine(x) : cat==="shops" ? shopLine(x) : cat==="factions" ? factionLine(x) : personLine(x);

function render(){
  const send = toSend();
  $("#tabs").innerHTML = [["loot","Items",db.loot.length],["npcs","People",db.npcs.length],["spells","Spells",db.spells.length],["shops","Shops",db.shops.length],["factions","Factions",db.factions.length],["send","Send",send]].map(([k,l,n]) =>
    `<button class="tab ${ui.tab===k?"on":""}" data-tab="${k}">${l}<small>${k==="send" ? (n ? `<span class="badge">${n}</span>` : "all sent") : n}</small></button>`).join("");
  $("#hdr").hidden = !!entry();
  const v = $("#view");
  if (ui.tab==="send") v.innerHTML = sendView();
  else if (entry()) v.innerHTML = sheetView(ui.tab, entry());
  else v.innerHTML = listView(ui.tab);
}

function listView(cat){
  const q = ui.q.trim().toLowerCase(), list = db[cat].filter(x => !q || JSON.stringify(x).toLowerCase().includes(q));
  return `<input class="search" type="text" data-q placeholder="Search your ${CAT_WORD[cat][1]}…" value="${esc(ui.q)}">
    <button class="btn wide main" data-act="new">+ ${CAT_WORD[cat][2]}</button>
    ${cat==="spells" ? `<div class="with" style="margin:-2px 0 12px"><input type="text" data-copyname list="dl-srdspells" placeholder="…or start from an SRD spell"><button class="btn" data-act="copysrd">Copy</button></div><datalist id="dl-srdspells">${Survey.SRD_SPELLS.map(s=>`<option value="${esc(s.name)}">`).join("")}</datalist>` : ""}
    ${list.length ? list.map(x => `<button class="card" data-open="${esc(x.id)}">${changed(x) ? `<span class="dot" title="Not sent yet"></span>` : ""}<span class="nm">${esc(x.name||"Unnamed")}</span>
      ${lineOf(cat, x) ? `<span class="sub">${esc(lineOf(cat, x))}</span>` : ""}</button>`).join("")
      : `<p class="empty">${q ? "Nothing matches." : `No ${CAT_WORD[cat][1]} yet. Make one, and send it to the survey from the Send tab.`}</p>`}
    ${list.length ? `<p class="note">A red dot: made or changed since you last sent.</p>` : ""}`;
}

/* ── one entry's page ── */
const fv = (x, k) => { if (k.includes(".")) { const [a, b, c] = k.split("."); return a==="atk" ? ((x.attacks||[])[+b]||{})[c] : (x[a]||{})[b]; } return x[k]; };
const T = (x, k, label, ph, flex, type) => `<label class="fld" style="flex:${flex||1}"><span>${label}</span><input ${type?`type="${type}" inputmode="${type==="number"?"numeric":"text"}"`:`type="text"`} data-f="${k}" value="${esc(fv(x,k) ?? "")}" placeholder="${esc(ph||"")}"></label>`;
const TA = (x, k, label, ph, rows, dice) => `<label class="fld"><span>${label}</span><div class="with"><textarea data-f="${k}" rows="${rows||3}" placeholder="${esc(ph||"")}">${esc(x[k]||"")}</textarea>${dice?`<button class="btn dice" data-roll="${dice}" aria-label="Roll one" title="Roll one">🎲</button>`:""}</div></label>`;
const SEL = (x, k, label, opts, flex, blank) => `<label class="fld" style="flex:${flex||1}"><span>${label}</span><select data-f="${k}">${blank!=null?`<option value="">${esc(blank)}</option>`:""}${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v)===String(x[k]??"")?"selected":""}>${esc(l)}</option>`; }).join("")}</select></label>`;
const CHK = (x, k, label) => `<label class="check"><input type="checkbox" data-f="${k}" ${x[k]?"checked":""}> ${label}</label>`;
const SEC = (key, title, body, extra, open) => `<details class="sec" data-sec="${key}" ${open || openSecs.has(key) ? "open" : ""}><summary>${title}${extra?`<small>${esc(extra)}</small>`:""}</summary>${body}</details>`;
const openSecs = new Set();

function sheetView(cat, x){
  const draft = !!ui.draft, word = CAT_WORD[cat];
  const top = `<div class="sheet-top"><button class="btn small" data-act="back">‹ ${draft ? "Cancel" : word[1].charAt(0).toUpperCase()+word[1].slice(1)}</button>
    <div class="ttl"><b id="ttl">${esc(x.name || word[2])}</b>${draft ? `<small>not added yet</small>` : ""}</div></div>`;
  const body = cat==="loot" ? itemForm(x) : cat==="spells" ? spellForm(x) : cat==="shops" ? shopForm(x) : cat==="factions" ? factionForm(x) : personForm(x);
  const foot = draft
    ? `<div class="foot"><button class="btn wide main" data-act="add" id="addBtn">Add${x.name ? " " + esc(x.name) : ""} to the Field Book</button></div>`
    : `<div class="foot"><div class="row"><button class="btn" style="flex:2" data-act="back">Done</button><button class="btn danger" style="flex:1" data-act="del">Delete</button></div></div>`;
  return top + (draft ? `<div class="draft-mark">${body}</div>` : body) + foot;
}

function itemForm(x){
  const guess = rarityGuess(x.rarity, x.kind==="potion");
  return `${T(x,"name","Name","A lantern that burns without oil")}
    <div class="row">${SEL(x,"kind","Kind",LOOT_KINDS)}${SEL(x,"rarity","Rarity",RARITIES,1,"—")}</div>
    <div class="row">${T(x,"value","Value",guess||"50 gp",1.3)}${T(x,"wt","Weight","lb",.8)}</div>
    ${guess ? `<p class="note" style="margin-top:-6px">Guide for ${esc(x.rarity)}${x.kind==="potion"?" (a potion: half)":""}: ${esc(guess)}. A price you type stays put.</p>` : ""}

  const list = what==="all" ? allEntries() : allEntries().filter(changed);
  if (!list.length) return;
  const text = JSON.stringify(pack(list), null, 1), name = `field-book-${stamp().replace(" ","-")}.json`;
  const file = new File([text], name, { type:"application/json" });
  /* Chrome on Android shares only some kinds of file (text, PDFs, pictures…), not .json: the same contents as a .txt, which the survey reads too */
  const shareFile = new File([text], name.slice(0, -5) + ".txt", { type:"text/plain" });
  const done = () => { const t = Date.now(); for (const x of list) x.fbSent = x.fbEdited || t; db.lastSent = t; save(true); render(); };
  if (navigator.canShare && navigator.canShare({ files:[shareFile] })) {
    try { await navigator.share({ files:[shareFile], title:"Field Book", text:`${list.length} from the Field Book, for Ordinate Survey` }); done(); toast(`Sent ${list.length}.`); return; }
    catch (e) { if (e && e.name==="AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  done(); toast(`Saved ${name}.`);
}
async function copyText(){
  const fresh = allEntries().filter(changed), list = fresh.length ? fresh : allEntries();
  lastText = JSON.stringify(pack(list));
  try { await navigator.clipboard.writeText(lastText); toast(`Copied ${list.length}${fresh.length ? "" : " (everything: nothing was new)"}. Paste it to Claude or into an email.`); }
  catch (e) { toast("Couldn't copy by itself: copy the text below."); }
  render();
}
function bringIn(text){
  let o; try { o = JSON.parse(text); } catch (e) { toast("That isn't a Field Book file."); return; }
  if (!o || (!Array.isArray(o.loot) && !Array.isArray(o.npcs) && !Array.isArray(o.spells) && !Array.isArray(o.shops) && !Array.isArray(o.factions))) { toast("No items or people in that file."); return; }
  let added = 0, updated = 0;
  for (const cat of ["loot","npcs","spells","shops","factions"]) for (const x of (o[cat]||[])) {
    if (!x || typeof x!=="object" || !x.name) continue;
    if (!x.id) x.id = uid(cat==="loot" ? "ll" : cat==="spells" ? "lsp" : cat==="shops" ? "lsh" : cat==="factions" ? "lfa" : "ln");
    if (cat==="factions" && o.app==="Ordinate Survey") x.fbSurvey = 1;      // the survey has it: its standing is the table's
    const had = db[cat].find(y=>y.id===x.id), t = Date.now();
    if (had) { Object.assign(had, x); had.fbSent = had.fbEdited = t; updated++; } else { x.fbMade = x.fbSent = x.fbEdited = t; db[cat].push(x); added++; }
  }
  save(true); render(); toast(added || updated ? `Brought in: ${added} new, ${updated} updated.` : "Nothing new in that file.");
}

/* ── doing things ── */
function touch(x){ x.fbEdited = Date.now(); if (db.spells.includes(x) || (ui.draft && ui.draft.cat==="spells" && ui.draft.x===x)) Survey.spellTidy(x); if (!ui.draft) save(); }
function setField(x, k, v){
  if (k.startsWith("atk.")) { const [, j, f] = k.split("."); (x.attacks = x.attacks||[])[+j] = Object.assign(x.attacks[+j]||{}, { [f]:v }); }
  else if (k.startsWith("purse.")) { x.purse = x.purse||{}; const n = Math.max(0, Math.round(+v||0)); if (n) x.purse[k.slice(6)] = n; else delete x.purse[k.slice(6)]; }
  else if (v==="" || v===false) delete x[k];
  else x[k] = v;
}
const view = $("#view");
view.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.q != null) { ui.q = t.value; const at = t.selectionStart; render(); const s = $(".search"); if (s) { s.focus(); try { s.setSelectionRange(at, at); } catch (err) {} } return; }
  const x = entry(); if (!x) return;
  /* a stat block by name: the SRD's own, matched as you type */
  if (t.dataset.fname != null) { const v = t.value.trim(), m = Survey.SRD_FOES.find(f=>f.name.toLowerCase()===v.toLowerCase()); x.fightsAs = m ? m.id : (v || "block"); touch(x); return; }
  if (t.dataset.compmat != null) { const p = Survey.compParts(x.comp); p.mat = t.value.trim(); x.comp = Survey.compText(p); touch(x); return; }
  const k = t.dataset.f; if (!k || t.type==="checkbox" || t.tagName==="SELECT") return;
  setField(x, k, t.value); touch(x);
  const md = view.querySelector(`[data-mod="${k}"]`); if (md) { const v = parseInt(t.value); md.textContent = isFinite(v) ? Survey.abMod(v) : ""; }
  if (k==="name") { const b = $("#ttl"); if (b) b.textContent = t.value || CAT_WORD[ui.tab][2]; const a = $("#addBtn"); if (a) a.textContent = `Add${t.value.trim() ? " " + t.value.trim() : ""} to the Field Book`; }
});
view.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.ui) { const k = t.dataset.ui; ui[k] = k==="level" ? Math.max(1, Math.min(20, Math.round(+t.value) || 1)) : t.value; if (k==="level") t.value = ui.level;
    if (k==="type") ui.foe = "";
    db.roll = Object.fromEntries(ROLL_KEYS.map(q=>[q, ui[q]])); save(); if (k==="type" || k==="kind") render(); return; }
  const x = entry(); if (!x) return;
  /* a spell's components, ticked: rebuilt into the usual "V, S, M (…)" */
  if (t.dataset.comp != null) { const on = k => !!(view.querySelector(`[data-comp="${k}"]`)||{}).checked, mat = view.querySelector("[data-compmat]");
    x.comp = Survey.compText({ v:on("v"), s:on("s"), m:on("m"), mat: mat ? mat.value.trim() : Survey.compParts(x.comp).mat }); touch(x); render(); return; }
  if (t.dataset.soldat != null) { const s = new Set(x.soldAt||[]); if (t.checked) s.add(t.dataset.soldat); else s.delete(t.dataset.soldat); if (s.size) x.soldAt = [...s]; else delete x.soldAt; touch(x); render(); return; }
  if (t.dataset.shopfrom != null) { const S = Survey.SHOP_TEMPLATES[t.value]; if (!S) return;
    Object.assign(x, { keeper:S.keeper, staff:(S.staff||[])[0]||"", staff2:(S.staff||[])[1]||"", nmin:String(S.n[0]), nmax:String(S.n[1]), srd:S.srd.join("\n"), goods:S.goods.map(g=>g.join(" | ")).join("\n") });
    if (!x.name) x.name = `${S.label} (yours)`; touch(x); render(); return; }
  /* a weapon picked for their attacks, worked out from their sheet the survey's way */
  if (t.dataset.weap != null) { const at = t.value && Survey.weaponAttack(x, t.value); if (!at) return; (x.attacks = x.attacks||[]).push(at); touch(x); render(); toast(`${at.name}: ${at.hit} to hit, ${at.dmg} ${at.dtype}.`); return; }
  /* Other… in a dropdown: type the new one */
  if (t.tagName==="SELECT" && t.value==="__other") { const k = t.dataset.f, v = prompt(k==="species" ? "Their species:" : k==="cls" ? "Their class:" : k==="time" ? "Casting time:" : "Type it:", x[k]||""); if (v!=null && v.trim()) x[k] = v.trim(); touch(x); render(); return; }
  if (t.dataset.fmode != null) { x.fightsAs = t.value==="block" ? (fightsWord(x.fightsAs)!=="self" && x.fightsAs ? x.fightsAs : "block") : t.value; if (!x.fightsAs) delete x.fightsAs; touch(x); render(); return; }
  /* a faction's alignment or standing: what it means, shown again */
  if (t.dataset.f && (t.dataset.f==="align" || t.dataset.f==="standing") && (db.factions.includes(x) || (ui.draft && ui.draft.cat==="factions"))) { setField(x, t.dataset.f, t.value); touch(x); render(); return; }
  const k = t.dataset.f; if (!k) return;
  if (t.type==="checkbox") setField(x, k, t.checked);
  else if (t.tagName==="SELECT") {
    setField(x, k, t.value);
    if (k==="lv") x.lv = +t.value || 0;
    /* the price follows the rarity (half for a potion) unless you typed one */
    if ((k==="rarity" || k==="kind") && ui.tab==="loot") { const g = rarityGuess(x.rarity, x.kind==="potion"); if (g && (!x.value || /^~/.test(String(x.value).trim()))) x.value = g; }
  } else return;
  touch(x); render();
});
view.addEventListener("toggle", e => { const d = e.target; if (d.dataset && d.dataset.sec) { if (d.open) openSecs.add(d.dataset.sec); else openSecs.delete(d.dataset.sec); } }, true);
view.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-open],[data-roll]"); if (!b) return;
  if (b.dataset.open) { ui.open = b.dataset.open; ui.draft = null; render(); scrollTo(0, 0); return; }
  const x = entry();
  if (b.dataset.roll && x) {
    const r = b.dataset.roll, d = ui.disp || pickOne(["enemy","neutral","ally"]);
    if (r==="name") x.name = rollName();
    else if (r==="align") x.align = rollAlignment(ui.disp);
    else if (r==="look") x.look = cap(pickOne(GEN_LOOK));
    else if (r==="voice") x.voice = cap(pickOne(GEN_VOICE));
    else if (r==="wants") x.wants = cap(pickOne(GEN_WANTS[d]));
    else if (r==="knows") x.knows = cap(pickOne(GEN_SECRET));
    else if (r==="backstory") x.backstory = rollBackstory();
    /* the whole person, rolled by the survey's own Someone to meet: stat block, hit points, spells, weapons, the lot */
    else if (r==="whole") { const keep = x.id, g = Survey.genPerson({ level:+ui.level || 3, disp:ui.disp, role:ui.kind ? "" : ui.role, kind:ui.kind || "", species:ui.species, align:ui.align, type:ui.type || "Humanoid", foe:ui.foe });
      if (g.kind!=="person") { toast(g.why || "Nothing to roll."); return; }
      for (const k of Object.keys(x)) delete x[k]; Object.assign(x, JSON.parse(JSON.stringify(g.person)), { id:keep }); openSecs.add("sheet"); }
    touch(x); render(); return;
  }
  const a = b.dataset.act;
  if (a==="new") { const cat = ui.tab; ui.draft = { cat, x: cat==="loot" ? { id:uid("ll"), name:"", kind:"curio" } : cat==="spells" ? Object.assign(Survey.blankLib("spells"), { id:uid("lsp"), name:"" }) : cat==="shops" ? { id:uid("lsh"), name:"", keeper:"merchant", nmin:"4", nmax:"6" } : cat==="factions" ? { id:uid("lfa"), name:"", align:"", standing:0 } : { id:uid("ln"), name:"" } }; ui.open = null; render(); scrollTo(0, 0);
    const n = view.querySelector('[data-f="name"]'); if (n) n.focus(); return; }
  if (a==="back") { ui.draft = null; ui.open = null; save(true); render(); return; }
  if (a==="add" && ui.draft) {
    const d = ui.draft.x; d.name = String(d.name||"").trim();
    if (!d.name) { toast("Give it a name first."); const n = view.querySelector('[data-f="name"]'); if (n) n.focus(); return; }
    d.fbMade = d.fbEdited = Date.now(); db[ui.draft.cat].unshift(d); ui.draft = null; ui.open = null; save(true); render(); toast(`${d.name} is in the Field Book.`); return;
  }
  if (a==="del" && x) { if (!confirm(`Delete ${x.name||"this"} from the Field Book?${x.fbSent ? " (What you already sent to the survey stays there.)" : ""}`)) return;
    db[ui.tab] = db[ui.tab].filter(y=>y!==x); ui.open = null; save(true); render(); return; }
  if (a==="atkadd" && x) { (x.attacks = x.attacks||[]).push({ name:"", hit:"", dmg:"", dtype:"" }); touch(x); render(); return; }
  if (a==="spadd" && x) { const i = view.querySelector("[data-spname]"), s = i && Survey.spellByName(i.value); if (!s) { toast("Pick a spell from the list."); return; }
    x.spells = x.spells||[]; if (!x.spells.includes(s.id)) x.spells.push(s.id); touch(x); render(); toast(`${x.name||"They"} knows ${s.name}.`); return; }
  /* start a spell of your own from an SRD one: a copy to change, not yet added */
  if (a==="copysrd") { const i = view.querySelector("[data-copyname]"), s = i && Survey.SRD_SPELLS.find(q=>q.name.toLowerCase()===String(i.value).trim().toLowerCase());
    if (!s) { toast("Pick an SRD spell from the list."); return; }
    const c = Survey.copyFromSrd("spells", s.id); c.id = uid("lsp"); ui.draft = { cat:"spells", x:c }; ui.open = null; render(); scrollTo(0, 0); return; }
  if (a==="spdel" && x) { x.spells = (x.spells||[]).filter(s=>s!==b.dataset.sp); touch(x); render(); return; }
  if (a==="atkdel" && x) { (x.attacks||[]).splice(+b.dataset.k, 1); touch(x); render(); return; }
  if (a==="carryadd" && x) { const s = view.querySelector("[data-carrypick]"), it = s && db.loot.find(i=>i.id===s.value); if (!it) { toast("Pick an item first."); return; }
    x.carries = (String(x.carries||"").replace(/\s+$/,"") ? String(x.carries).replace(/\s+$/,"") + "\n" : "") + it.name; touch(x); render(); toast(`${x.name||"They"} carries ${it.name}.`); return; }
  if (a==="send") return void send(b.dataset.what);
  if (a==="copy") return void copyText();
  if (a==="import") { $("#fileIn").click(); return; }
  if (a==="wipe") { if (!confirm("Delete every item and person on this phone? Anything not sent is gone for good.") || !confirm("Really delete everything?")) return;
    db.loot = []; db.npcs = []; db.spells = []; db.shops = []; db.factions = []; save(true); render(); toast("Emptied."); return; }
});
$("#fileIn").onchange = e => { const f = e.target.files && e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => bringIn(String(r.result||"")); r.readAsText(f); e.target.value = ""; };
$("#tabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (!b) return;
  if (ui.draft && ui.draft.x.name && !confirm(`Leave ${ui.draft.x.name} without adding it?`)) return;
  ui.tab = b.dataset.tab; ui.open = null; ui.draft = null; ui.q = ""; render(); scrollTo(0, 0); };

/* ── getting it onto the home screen: Android offers an install (shown as a button here); an iPhone never offers,
   so say how (Share → Add to Home Screen). Hidden once it's running as an installed app. ── */
const installed = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let installEvt = null;
function showInstall(){
  const box = $("#install"); if (!box) return;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints > 1);
  if (installed()) { box.hidden = true; return; }
  if (installEvt) { box.innerHTML = `<div class="row" style="align-items:center"><span style="flex:1">Put Field Book on your home screen; it works offline.</span><button class="btn small main" id="installBtn">Download the app</button></div>`; box.hidden = false;
    $("#installBtn").onclick = async () => { const e = installEvt; installEvt = null; e.prompt(); try { await e.userChoice; } catch (err) {} showInstall(); }; return; }
  if (ios) { box.innerHTML = `To put Field Book on your home screen: tap <b>Share</b> <span aria-hidden="true">⬆︎</span> (at the bottom in Safari, or by the address bar in Chrome), then <b>Add to Home Screen</b>. If there's no Share button, you're in another app's browser: open this page in Safari first.`; box.hidden = false; return; }
  /* Android with no offer from Chrome yet (or opened inside another app's browser): the button explains the way */
  if (!/Android/i.test(navigator.userAgent)) { box.hidden = true; return; }
  box.innerHTML = `<div class="row" style="align-items:center"><span style="flex:1">Put Field Book on your home screen; it works offline.</span><button class="btn small main" id="installBtn">Download the app</button></div><div id="installHow" hidden style="margin-top:8px"></div>`;
  box.hidden = false;
  $("#installBtn").onclick = () => { const h = $("#installHow"); h.hidden = !h.hidden;
    h.innerHTML = `In Chrome, tap <b>⋮</b> (top right), then <b>Add to home screen</b> → <b>Install</b>.<br>No ⋮ menu with that, or a plain X at the top left? You're in another app's browser: tap its menu and <b>Open in Chrome</b>, then do the above.`; };
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; showInstall(); });
window.addEventListener("appinstalled", () => { installEvt = null; showInstall(); toast("Field Book is on your home screen."); });
$("#ver").textContent = "v" + VERSION;
applyTheme(); render(); showInstall();

// ── service worker (offline once installed) ──
if ("serviceWorker" in navigator && location.protocol === "https:") {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!hadController || reloaded) return; reloaded = true; location.reload(); });
  navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then(reg => { reg.update(); setInterval(() => { try { reg.update(); } catch (e) {} }, 30 * 60 * 1000); }).catch(() => {});
}
</script>
</body>
</html>
